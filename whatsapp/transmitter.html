<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Transmitter</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; padding: 30px; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 500px; background: #222; padding: 25px; border-radius: 8px; border: 1px solid #444; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
  .header h2 { margin: 0; }
  .logout-btn { background: #dc3545; padding: 8px 12px; font-size: 14px; border: none; border-radius: 4px; color: white; cursor: pointer; }
  .logout-btn:hover { background: #c82333; }
  input, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
  textarea { height: 140px; resize: vertical; }
  .send-btn { width: 100%; padding: 12px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; }
  .send-btn:hover { background: #218838; }
  #result { margin-top: 20px; white-space: pre-wrap; font-family: monospace; color: #0f0; background: #000; padding: 10px; border-radius: 4px; display: none; }
</style>

  <script>
  const token = sessionStorage.getItem("sessionToken");
  
  if (!token) {
    window.location.replace("login.html");
  } else {
    // True server-side session validation
    fetch("https://elwoic-whatsapp-api.aswanthkrishnak822.workers.dev/session", {
      method: "GET",
      headers: { "Authorization": "Bearer " + token }
    })
    .then(res => {
      if (!res.ok) throw new Error("Session Invalid");
    })
    .catch(() => {
      sessionStorage.removeItem("sessionToken");
      window.location.replace("login.html");
    });
  }
</script>
</head>
<body>

<script>
  // BOUNCER: Check clearance before rendering anything
  const token = sessionStorage.getItem("secretToken");
  if (!token) {
    // No token? Eject them back to login.
    window.location.replace("login.html"); 
  }
</script>

<div class="container">
  <div class="header">
    <h2>Transmitter</h2>
    <button class="logout-btn" onclick="logout()">Terminate Session</button>
  </div>
  
  <label>Target Phone Number</label>
  <input id="phone" placeholder="919876543210">
  
  <label>Encrypted Message</label>
  <textarea id="message" placeholder="Type your message..."></textarea>
  
  <button class="send-btn" onclick="sendMessage()">Transmit</button>
  
  <div id="result"></div>
</div>

<script>
  function logout() {
    sessionStorage.removeItem("secretToken");
    window.location.replace("login.html");
  }

  async function sendMessage() {
    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message").value;
    const result = document.getElementById("result");
    const currentToken = sessionStorage.getItem("secretToken");

    result.style.display = "block";
    result.style.color = "#aaa";
    result.innerHTML = "Encrypting and transmitting...";

    try {
      const response = await fetch("https://elwoic-whatsapp-api.aswanthkrishnak822.workers.dev", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + currentToken
        },
        body: JSON.stringify({
          phone: phone,
          message: message
        })
      });

      const data = await response.json();
      
      if (response.status === 401) {
        result.style.color = "red";
        result.innerHTML = "Access Denied. Invalid Token. Ejecting...";
        setTimeout(logout, 2000); // Bad token? Kick them out.
      } else if (!response.ok) {
        result.style.color = "red";
        result.innerHTML = "Error:\n" + JSON.stringify(data, null, 2);
      } else {
        result.style.color = "#0f0";
        result.innerHTML = "Transmission successful:\n" + JSON.stringify(data, null, 2);
        
        // Optional: clear the message box after sending
        document.getElementById("message").value = "";
      }
    } catch(err) {
      result.style.color = "red";
      result.innerHTML = "Transmission failed: " + err.message;
    }
  }
</script>

</body>
</html>
